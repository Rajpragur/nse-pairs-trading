name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: pairs-fetch-angelone --help
      - run: python -c 'from pairs_trading.demo import make_pair_data; print(len(make_pair_data()[0]))'
      - name: Run synthetic demo without changing tracked results
        run: python -c 'from pairs_trading.demo import main; main("/tmp/pairs-demo-ci")'

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: cmake -S cpp -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
